name: Build iOS Unsigned IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile iOS IPA on macOS
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Force Latest Xcode (Fixes Swift 6.2.0 mismatch)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: 4. Install JS dependencies
        run: |
          npm install --legacy-peer-deps
          npx expo install --fix

      - name: 5. Generate native iOS project (Expo Prebuild)
        env:
          CI: "1"
          EXPO_NO_GIT_STATUS: "1"
        run: npx expo prebuild --platform ios --clean --no-install

      - name: 6. Install CocoaPods
        working-directory: ios
        run: pod install

      - name: 7. Build Release .app with Xcode (Unsigned)
        working-directory: ios
        run: |
          set -eo pipefail
          
          # Fix for "FBReactNativeSpec" script losing Node.js path
          export NODE_BINARY=$(command -v node)
          
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Compilando Workspace: $WORKSPACE | Scheme: $SCHEME | Node: $NODE_BINARY"

          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: 8. Verify Binary & Package into .ipa
        working-directory: ios
        run: |
          set -e
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encontró la carpeta .app"
            exit 1
          fi

          echo "Contenido compilado dentro de $APP_PATH:"
          ls -la "$APP_PATH"

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR CRÍTICO: El paquete .app está incompleto (no contiene Info.plist ni ejecutable)."
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y OfflineVibe.ipa Payload

          echo "Tamaño final del IPA generado:"
          ls -lh OfflineVibe.ipa

      - name: 9. Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineVibe-iOS-IPA
          path: ios/OfflineVibe.ipa
          retention-days: 14